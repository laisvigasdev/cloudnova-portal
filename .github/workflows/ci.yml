
name: CloudNova CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t cloudnova-portal:ci .

      - name: Login to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: az account show --query name --output tsv

      - name: Login to Azure Container Registry
        run: az acr login --name acrcloudnovalab26

      - name: Push Docker image to ACR
        run: |
          IMAGE=acrcloudnovalab26-ekara4gwc2cee2g6.azurecr.io/cloudnova-portal:${GITHUB_SHA}
          docker tag cloudnova-portal:ci "$IMAGE"
          docker push "$IMAGE"
