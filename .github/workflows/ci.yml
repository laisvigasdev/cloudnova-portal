
name: CloudNova CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t cloudnova-portal:ci .

      - name: Login to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: az account show --query name --output tsv

      - name: Login to Azure Container Registry
        run: az acr login --name acrcloudnovalab26

      - name: Push Docker image to ACR
        run: |
          IMAGE=acrcloudnovalab26-ekara4gwc2cee2g6.azurecr.io/cloudnova-portal:${GITHUB_SHA}
          docker tag cloudnova-portal:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy to Azure Container Instances
        run: |
          ACI_ID=$(az container show \
            --resource-group rg-cloudnova-lab \
            --name aci-cloudnova-web \
            --query "keys(identity.userAssignedIdentities)[0]" \
            --output tsv)

          test -n "$ACI_ID"

          IMAGE=acrcloudnovalab26-ekara4gwc2cee2g6.azurecr.io/cloudnova-portal:${GITHUB_SHA}

          az container create \
            --resource-group rg-cloudnova-lab \
            --name aci-cloudnova-web \
            --location norwayeast \
            --image "$IMAGE" \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --ports 80 \
            --ip-address Private \
            --vnet vnet-cloudnova \
            --subnet frontend-subnet \
            --assign-identity "[system]" "$ACI_ID" \
            --acr-identity "$ACI_ID" \
            --restart-policy OnFailure \
            --output none

      - name: Verify ACI deployment
        run: |
          az container show \
            --resource-group rg-cloudnova-lab \
            --name aci-cloudnova-web \
            --query "{state:instanceView.state,image:containers[0].image,ip:ipAddress.ip}" \
            --output json
